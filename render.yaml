services:
  - type: web
    name: gymflow-api
    runtime: python
    plan: free
    rootDir: backend
    healthCheckPath: /api/v1/health
    buildCommand: pip install -r requirements.txt
    startCommand: python bootstrap.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "480"
      - key: COOKIE_SECURE
        value: "true"
      - key: ALLOWED_ORIGINS
        fromService:
          name: gymflow-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: gymflow-web
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: corepack enable && corepack prepare pnpm@10.12.1 --activate && pnpm install && pnpm build
    startCommand: pnpm start -- -p $PORT
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: gymflow-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
